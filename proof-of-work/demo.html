<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GovernPilot proof — what the ledger catches</title>
<style>
  :root {
    --bg: #121714;
    --bg-2: #1b2420;
    --ink: #17211c;
    --paper: #f4efe4;
    --paper-2: #e7dcc6;
    --muted: #5e6a62;
    --copper: #c47a45;
    --copper-2: #8a4e28;
    --seal: #0e7a49;
    --seal-ink: #e7fff3;
    --break: #b42318;
    --break-ink: #fff4f2;
    --amber: #8a5a12;
    --amber-ink: #fff6e4;
    --line: rgba(244, 239, 228, 0.14);
    --serif: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(196, 122, 69, 0.18), transparent 55%),
      radial-gradient(900px 480px at 110% 0%, rgba(14, 122, 73, 0.12), transparent 50%),
      var(--bg);
    color: var(--paper);
    font-family: var(--serif);
  }
  button, input { font: inherit; color: inherit; }
  .room { max-width: 1280px; margin: 0 auto; padding: 28px 28px 18px; }
  header.top {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }
  .kicker {
    margin: 0 0 6px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--copper);
  }
  h1 {
    margin: 0;
    font-size: 34px;
    line-height: 1.05;
    font-weight: 600;
    max-width: 760px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .chip {
    min-width: 92px;
    border: 1px solid var(--line);
    background: rgba(244, 239, 228, 0.04);
    padding: 8px 10px 7px;
    border-radius: 4px;
  }
  .chip b { display: block; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .chip span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #c9d2cb; }
  .chip.pass b { color: #8ddeb6; }
  .chip.fail b { color: #ffb4ab; }
  .chip.unsupported b { color: #f2c37a; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 22px; margin-top: 18px; }
  nav { display: flex; flex-direction: column; gap: 8px; }
  nav button {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
  }
  nav button strong { display: block; font-size: 16px; }
  nav button em { display: block; margin-top: 3px; font-style: normal; font-family: var(--mono); font-size: 11px; color: #b7c2bb; }
  nav button.active { background: rgba(244, 239, 228, 0.06); border-color: var(--line); }
  .stage-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; min-height: 72px; }
  .stage-head h2 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button, .ghost-btn {
    background: var(--paper);
    color: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .bench { min-height: 470px; }
  .chain {
    display: flex;
    align-items: stretch;
    gap: 0;
    overflow-x: auto;
    padding: 8px 2px 12px;
  }
  .card {
    width: 168px;
    flex: 0 0 auto;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    border-radius: 8px;
    padding: 12px 12px 10px;
    position: relative;
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.28);
    animation: rise 0.55s ease both;
  }
  .card header, .card p { margin: 0; }
  .card header { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .who { margin-top: 14px !important; font-size: 20px; line-height: 1.05; }
  .role { margin-top: 4px !important; color: var(--muted); font-size: 13px; }
  .hash { margin-top: 8px !important; font-family: var(--mono); font-size: 11px; color: #3d4a43; white-space: nowrap; }
  .hash em { font-style: normal; color: var(--copper-2); margin-right: 4px; }
  .seal {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    border: 2px solid var(--seal);
    color: var(--seal);
    border-radius: 999px;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    transform: rotate(-8deg);
  }
  .card.bad { outline: 3px solid var(--break); }
  .card.bad .seal { border-color: var(--break); color: var(--break); background: var(--break-ink); animation: shake 0.45s ease both; }
  .join {
    width: 54px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .wire {
    height: 4px;
    width: 100%;
    background: var(--seal);
    border-radius: 99px;
    transform-origin: left center;
    animation: draw 0.45s ease both;
  }
  .join span.tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; color: #8ddeb6; }
  .join.broken .wire { background: var(--break); height: 4px; background-image: linear-gradient(90deg, var(--break) 40%, transparent 40%, transparent 60%, var(--break) 60%); background-size: 12px 4px; }
  .join.broken span.tag { color: #ffb4ab; }
  .inspector {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1.4fr 0.8fr;
    gap: 12px;
  }
  .panel {
    background: rgba(244, 239, 228, 0.05);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 18px; }
  .panel p { margin: 0 0 8px; color: #e4ece7; font-size: 16px; line-height: 1.35; }
  .mono { font-family: var(--mono); font-size: 12px; line-height: 1.45; color: #d5e0da; overflow-wrap: break-word; }
  .gap {
    border-left: 4px solid var(--amber);
    padding-left: 10px;
    color: #f2c37a;
  }
  .banner { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; color: var(--copper); }
  .outcomes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .outcome {
    border-radius: 8px;
    padding: 14px;
    background: var(--paper);
    color: var(--ink);
    min-height: 0;
    animation: rise 0.5s ease both;
  }
  .outcome .status {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 4px 8px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .outcome h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.15; }
  .outcome p { margin: 0; font-size: 14px; line-height: 1.35; }
  .outcome.pass .status { background: var(--seal); color: var(--seal-ink); }
  .outcome.fail .status { background: var(--break); color: white; }
  .outcome.unsupported .status { background: var(--amber); color: white; }
  .outcome.pass { box-shadow: inset 0 0 0 2px var(--seal); }
  .outcome.fail { box-shadow: inset 0 0 0 2px var(--break); }
  .outcome.unsupported { box-shadow: inset 0 0 0 2px var(--amber); }
  footer {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: #b7c2bb;
  }
  .empty { padding: 48px 8px; font-size: 22px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes shake { 0%, 100% { transform: rotate(-8deg); } 40% { transform: rotate(6deg) scale(1.05); } }
  body.is-settled .card, body.is-settled .wire, body.is-settled .outcome, body.is-settled .seal { animation: none; opacity: 1; transform: none; }
  body.is-settled .seal { transform: rotate(-8deg); }
  @media (prefers-reduced-motion: reduce) {
    .card, .wire, .outcome, .seal { animation: none !important; opacity: 1; }
  }
  @media (max-width: 980px) {
    .layout, .inspector, .outcomes, header.top { grid-template-columns: 1fr; display: grid; }
    header.top { display: grid; }
    .chips { justify-content: flex-start; }
    h1 { font-size: 28px; }
  }
</style>
</head>

      "detail": "Three local-dev approvals were stored by the real server and the integrity endpoint reported the ledger passed.",
      "evidence": {
        "created": [
          {
            "create": 201,

      "detail": "POST /api/runs returned 422 and the run count stayed 3. Category reported: ssn. The raw string was not copied into this result. This block is the pilot data-boundary scanner, not the AI policy gate.",

  "manifest": {
    "file": "manifest.sha256",
    "algorithm": "sha256",
    "covers": [

    "note": "The manifest is computed after results.json is written. It does not hash itself, demo.html, or REPORT.md."

</script>
  <script>
    const STEPS = [
      { id: "clean", nav: "Clean chain", blurb: "All five seals hold", title: "Five signed approvals. Every link holds." },
      { id: "edit", nav: "Edited entry", blurb: "The HMAC seal breaks", title: "One field changes. That card's seal breaks." },
      { id: "delete", nav: "Deleted entry", blurb: "The pointer breaks", title: "A middle card is removed. The pointer that named it breaks." },
      { id: "closed", nav: "Fail closed", blurb: "A failed check does not save", title: "A failed or thrown policy check does not save the approval." },
    ];

    const embedded = document.getElementById("pow-results").textContent.trim();
    let results = {};
    try { results = JSON.parse(embedded || "{}"); } catch { results = {}; }

    const params = new URLSearchParams(location.search);
    if (params.get("settle") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.body.classList.add("is-settled");
    }

    let step = stepFromLocation();
    let playing = params.get("settle") !== "1";
    let timer = null;

    function stepFromLocation() {
      const query = params.get("step");
      const hash = location.hash.replace("#", "");
      const name = STEPS.some((item) => item.id === query) ? query : hash;
      return STEPS.some((item) => item.id === name) ? name : "clean";
    }

    function test(id) {
      return (results.tests || []).find((item) => item.id === id) || null;
    }

    function brief(value) {
      if (!value) return "null";
      return `${value.slice(0, 8)}…${value.slice(-4)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    async function hydrate() {
      render();
      try {
        const response = await fetch("results.json", { cache: "no-store" });
        if (response.ok) {
          results = await response.json();
          render();
        }
      } catch { /* file:// and offline keep the embedded copy */ }
      if (playing) schedule();
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;
      timer = setTimeout(() => {
        const index = STEPS.findIndex((item) => item.id === step);
        go(STEPS[(index + 1) % STEPS.length].id);
      }, 5600);
    }

    function go(next) {
      step = next;
      history.replaceState(null, "", `?step=${next}${document.body.classList.contains("is-settled") ? "&settle=1" : ""}#${next}`);
      render();
      if (playing) schedule();
    }

    function render() {
      const demo = results.demo;
      const summary = results.summary?.adversarial || { pass: "–", fail: "–", unsupported: "–" };
      document.getElementById("sha").textContent = (results.pinnedProductCommit || "unrecorded").slice(0, 12);
      document.getElementById("headline").textContent = demo
        ? "What the approval ledger actually catches."
        : "No results embedded yet. Run proof-of-work/run-all.sh.";
      document.getElementById("chips").innerHTML = [
        ["pass", summary.pass, "Pass"],
        ["fail", summary.fail, "Fail"],
        ["unsupported", summary.unsupported, "Unsupported"],
      ].map(([kind, count, label]) => `<div class="chip ${kind}"><b>${escapeHtml(count)}</b><span>${label}</span></div>`).join("");
      document.getElementById("nav").innerHTML = STEPS.map((item) =>
        `<button type="button" data-step="${item.id}" class="${item.id === step ? "active" : ""}"><strong>${item.nav}</strong><em>${item.blurb}</em></button>`
      ).join("");
      document.querySelectorAll("#nav button").forEach((button) => {
        button.addEventListener("click", () => {
          playing = false;
          document.getElementById("play").textContent = "Play";
          go(button.dataset.step);
        });
      });
      const current = STEPS.find((item) => item.id === step);
      document.getElementById("step-title").textContent = current.title;
      document.getElementById("play").textContent = playing ? "Pause" : "Play";
      document.getElementById("bench").innerHTML = demo ? (step === "closed" ? renderClosed(demo) : renderChain(demo)) : `<div class="empty">The runner writes results.json and embeds it here.</div>`;
      const suite = results.summary?.existingSuite;
      const node = results.node || "";
      document.getElementById("meta").textContent = [
        node && `Node ${node}`,
        results.ciNodePin && `CI pins Node ${results.ciNodePin}`,
        suite && `existing suite ${suite.pass} pass / ${suite.fail} fail`,
        results.finishedAt && results.finishedAt,
      ].filter(Boolean).join("  ·  ");
    }

    function renderChain(demo) {
      const removed = step === "delete" ? demo.deleteMiddle.removedId : null;
      const nodes = demo.chain.filter((node) => node.id !== removed);
      const checks = step === "edit" ? demo.edit.checks : step === "delete" ? demo.deleteMiddle.checks : demo.clean.checks;
      const checkById = new Map(checks.map((check) => [check.id, check]));
      const parts = [];
      nodes.forEach((node, index) => {
        const check = checkById.get(node.id);
        const badSeal = step === "edit" && node.id === demo.edit.id;
        const delay = document.body.classList.contains("is-settled") ? "" : `style="animation-delay:${index * 70}ms"`;
        parts.push(`<article class="card${badSeal ? " bad" : ""}" ${delay}>
          <header><span>${escapeHtml(node.position)}</span><span>${escapeHtml(node.id)}</span></header>
          <p class="who">${escapeHtml(step === "edit" && node.id === demo.edit.id ? demo.edit.to : node.reviewer)}</p>
          <p class="role">${escapeHtml(node.reviewerRole)} · ${escapeHtml(node.state)}</p>
          <p class="hash"><em>sig</em>${escapeHtml(brief(node.signature))}</p>
          <p class="hash"><em>prev</em>${escapeHtml(node.previousHash ? brief(node.previousHash) : "null")}</p>
          <div class="seal">${badSeal ? "SEAL BROKEN" : "SEALED"}</div>
        </article>`);
        if (index < nodes.length - 1) {
          const broken = check && check.chainLinkValid === false;
          parts.push(`<div class="join${broken ? " broken" : ""}"><div class="wire"></div><span class="tag">${broken ? "BROKEN" : "LINKED"}</span></div>`);
        }
      });
      const banner = step === "edit"
        ? `<p class="banner">Edited reviewer on ${escapeHtml(demo.edit.id)}. Signature bytes were not recomputed.</p>`
        : step === "delete"
          ? `<p class="banner">Removed ${escapeHtml(removed)} from the array. The newer card still names its signature.</p>`
          : `<p class="banner">Newest on the left. Each card’s previousHash must equal the next card’s signature.</p>`;
      return `${banner}<div class="chain">${parts.join("")}</div>${renderInspector(demo, checkById)}`;
    }

    function renderInspector(demo, checkById) {
      if (step === "clean") {
        const volume = demo.volume || {};
        return `<div class="inspector"><div class="panel"><h3>Verifier said passed</h3><p>verifyApprovalLedger accepted all five HMAC seals and every newest-to-oldest previousHash link. The same function serves GET /api/audit/integrity.</p><p class="mono">signature mode ${escapeHtml(volume.signatureMode || "")}</p></div><div class="panel"><h3>10,000 records</h3><p>Build ${escapeHtml(volume.buildMs)} ms. Verify ${escapeHtml(volume.verifyMs)} ms. One edited record inside that chain was detected.</p><p class="mono">Local HMAC only. Not 10,000 HTTP calls.</p></div></div>`;
      }
      if (step === "edit") {
        const broken = (demo.edit.checks || []).find((check) => !check.signatureValid || !check.chainLinkValid);
        return `<div class="inspector"><div class="panel"><h3>${demo.edit.status === "pass" ? "Caught" : "Not caught"}</h3><p>Reviewer on ${escapeHtml(demo.edit.id)} changed from “${escapeHtml(demo.edit.from)}” to “${escapeHtml(demo.edit.to)}”. The signature was left as-is.</p><p class="mono">${broken ? escapeHtml(broken.reason) : "no broken check"} · signatureValid ${broken ? broken.signatureValid : "?"} · chainLinkValid ${broken ? broken.chainLinkValid : "?"}</p></div><div class="panel"><h3>Which link</h3><p>The previousHash pointer on that card still matches the next signature. The link that broke is the HMAC seal tying the card to its own bytes.</p></div></div>`;
      }
      const broken = (demo.deleteMiddle.checks || []).find((check) => check.chainLinkValid === false);
      const head = demo.headTruncation || {};
      const headCaught = head.status === "pass";
      return `<div class="inspector"><div class="panel"><h3>${demo.deleteMiddle.status === "pass" ? "Caught" : "Not caught"}</h3><p>Removed ${escapeHtml(demo.deleteMiddle.removedId)}. ${broken ? escapeHtml(broken.id) + " still points at the deleted signature, so its previousHash does not match the next remaining signature." : "No chain link failed."}</p><p class="mono">${broken ? escapeHtml(broken.reason) : ""}</p></div><div class="panel"><h3${headCaught ? "" : " class=\"gap\""}>${headCaught ? "Newest deletion is caught too" : "Not the same as deleting the newest"}</h3><p${headCaught ? "" : " class=\"gap\""}>${escapeHtml(head.detail || "")}</p></div></div>`;
    }

    function lead(detail) {
      const text = String(detail || "No result recorded.").replace(/\s+/g, " ").trim();
      return text.length > 280 ? `${text.slice(0, 277)}…` : text;
    }

    function outcomeCard(item, title) {
      const status = item?.status || "unsupported";
      const label = status === "pass" ? "PASS" : status === "fail" ? "FAIL" : "NOT SUPPORTED";
      return `<article class="outcome ${escapeHtml(status)}"><div class="status">${label}</div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(lead(item?.detail))}</p></article>`;
    }

    function renderClosed(demo) {
      const closed = demo.failClosed || {};
      const error = closed.policyError || {};
      const missing = closed.missingPolicy || {};
      const violation = closed.policyViolation || {};
      const timeout = closed.timeout || {};
      const sensitive = closed.sensitiveWrite || {};
      return `<div class="outcomes">
        ${outcomeCard(error, "Policy check throws")}
        ${outcomeCard(missing, "Policy file missing")}
        ${outcomeCard(violation, "Policy result is fail")}
        ${outcomeCard(timeout, "Policy check times out")}
        ${outcomeCard(sensitive, "SSN-shaped write")}
        ${outcomeCard(closed.reviewer, "Reviewer recommendation")}
      </div>`;
    }

    document.getElementById("play").addEventListener("click", () => {
      playing = !playing;
      if (playing) schedule();
      else clearTimeout(timer);
      render();
    });
    document.getElementById("next").addEventListener("click", () => {
      playing = false;
      const index = STEPS.findIndex((item) => item.id === step);
      go(STEPS[(index + 1) % STEPS.length].id);
    });
    document.getElementById("prev").addEventListener("click", () => {
      playing = false;
      const index = STEPS.findIndex((item) => item.id === step);
      go(STEPS[(index - 1 + STEPS.length) % STEPS.length].id);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") document.getElementById("next").click();
      if (event.key === "ArrowLeft") document.getElementById("prev").click();
    });

    hydrate();
  </script>
</body>
